<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .loginContent{
            margin-top: 150px;
            box-shadow: 0px 0px 20px rgba(28, 126, 255, 0.868);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
        }
        
        .pass{
            width: 285px;
        }

        .loginButton{
            width: 285px;
        }

        input{
            box-shadow: 0px 0px 20px rgba(28, 126, 255, 0.868);
        }

        .glow-text {
            color: #d2e3ff; 

            text-shadow: 0 0 50px rgba(28, 126, 255, 0.868),
                         0 0 20px rgba(28, 126, 255, 0.868), 
                         0 0 10px rgba(28, 126, 255, 0.868);
                        
        }

        .passBox{
            width: 285px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

    </style>

    <title>Login Page</title>
</head>
<body class="d-flex justify-content-center align-items-center bg-black">
    <form class="loginContent d-flex justify-content-center align-items-center flex-column m-5 p-5">
        <div class="text-center mb-4">
            <i class="bi bi-person-circle display-4 text-primary logo"></i>
            <h2 class="fw-bold mt-2 glow-text">USER LOGIN</h2>
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label text-white">Email address</label>
            <input type="email" class="form-control border-0 bg-secondary" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email or Username">
            <div id="emailHelp" class="form-text text-white-50">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label text-white">Password</label>
            <input type="password" class="form-control border-0 pass bg-secondary" id="exampleInputPassword1" placeholder="Password">
        </div>
        <div class="mb-3 form-check passBox">
            <div>
                <input type="checkbox" class="form-check-input bg-secondary border-0" id="exampleCheck1">
                <label class="form-check-label text-white-50" for="exampleCheck1">Remember me</label>
            </div>
            <div>
                <p class="text-primary">Forgot password?</p>
            </div>
        </div>
        <button type="button" class="btn btn-primary loginButton fw-bold" onclick="loginProcess()">Login</button>
        <div class="text-white-50 mt-3">Don't have an account? <span class="text-primary">Register</span></div>
        <div id="display" class="text-danger mt-2"></div>
    </form>

    <script>
        function loginProcess(){
            let email = document.getElementById("exampleInputEmail1").value;
            let pass = document.getElementById("exampleInputPassword1").value;
        
            if(email === "iiuc@gmail.com" && pass === "iiuc123"){
                localStorage.setItem("isLoggedIn", "true");
                window.location.href="home.html";
            }
            else{
                localStorage.setItem("isLoggedIn", "false");
                document.getElementById("display").innerHTML = "<i class='bi bi-x-circle-fill me-2'></i>Wrong Email or Password";
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
