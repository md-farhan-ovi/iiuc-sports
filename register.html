<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .loginContent{
            margin-top: 150px;
            box-shadow: 0px 0px 20px rgba(28, 126, 255, 0.868);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
        }
        
        .pass{
            width: 285px;
        }

        .loginButton{
            width: 285px;
        }

        input{
            box-shadow: 0px 0px 20px rgba(28, 126, 255, 0.868);
        }

        .glow-text {
            color: #d2e3ff; 

            text-shadow: 0 0 50px rgba(28, 126, 255, 0.868),
                         0 0 20px rgba(28, 126, 255, 0.868), 
                         0 0 10px rgba(28, 126, 255, 0.868);
                        
        }

        .passBox{
            width: 285px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .reg{
            cursor: pointer;
        }

        .textBox{
            width: 285px !important;
        }

    </style>

    <title>Login Page</title>
</head>
<body class="d-flex justify-content-center align-items-center bg-black">
    <form class="loginContent d-flex justify-content-center align-items-center flex-column m-5 p-5">
        <div class="text-center mb-4">
            <i class="bi bi-person-circle display-4 text-primary logo"></i>
            <h2 class="fw-bold mt-2 glow-text">REGISTER</h2>
        </div>
        <div class="mb-3">
            <label for="inName" class="form-label text-white">Your Name</label>
            <input type="text" class="textBox form-control border-0 bg-secondary" id="inName" aria-describedby="emailHelp" placeholder="Enter Your Name">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label text-white">Email address</label>
            <input type="email" class="form-control border-0 bg-secondary" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email or Username">
            <div id="emailHelp" class="form-text text-white-50">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label text-white">Password</label>
            <input type="password" class="form-control border-0 pass bg-secondary" id="exampleInputPassword1" placeholder="Password">
        </div>
        <div class="mb-3">
            <label for="cnPass" class="form-label text-white">Confirm Password</label>
            <input type="password" class="form-control border-0 pass bg-secondary" id="cnPass" placeholder="Confirm Password">
        </div>

        <button type="button" class="btn btn-primary loginButton fw-bold my-4" onclick="signUp()">Sign Up</button>

        <div id="display" class="text-danger mt-2"></div>
    </form>

    <script>

        function signUp(){
            let email = document.getElementById("exampleInputEmail1").value;
            let pass = document.getElementById("exampleInputPassword1").value; 
            let nameBox = document.getElementById("inName").value;
            let confirmPass = document.getElementById("cnPass").value;   
            let result = document.getElementById("display");
            
            if(email !== "" && pass !== "" && nameBox !== "" && confirmPass !== ""){
                if(pass === confirmPass){
                    localStorage.setItem("emailSv",email);
                    localStorage.setItem("passSv", pass);
                    localStorage.setItem("accName", nameBox);
                    window.location.href = "index.html";
                }
                else{
                    result.innerHTML = "<i class='bi bi-x-circle-fill me-2'></i>Passwords do not match.";
                }
            }
            else{
                result.innerHTML = "<i class='bi bi-x-circle-fill me-2'></i>Please complete the form to continue."
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
